# Override dev: mount mã nguồn, runserver, astro dev, mở cổng localhost.
# Chạy: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up (make dev).
# Dùng image chính thức, không cần Dockerfile prod.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    environment:
      DJANGO_DEBUG: "1"
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    command: >
      sh -c "uv sync --frozen &&
             uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
      - venv-dev:/venv
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: node:26-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
             pnpm exec astro dev --host 0.0.0.0 --port 4321"
    volumes:
      - ../frontend:/app
      - node-modules-dev:/app/node_modules
    ports:
      - "127.0.0.1:4321:4321"

volumes:
  pgdata-dev:
  venv-dev:
  node-modules-dev:
