# Chỉ PROD (project `vyc`): Caddy mở 80/443, subnet cố định, nhìn thấy mạng và media của staging.
# Dùng: compose.yml + compose.prod.yml + compose.edge.yml, kèm `--profile edge` (van-hanh.md 2.2).
# Cần tạo một lần ngoài compose (deploy/README.md mục 3):
#   docker network create --subnet 172.29.0.0/24 vyc-staging
#   docker volume create vyc-staging_media
services:
  backend:
    networks:
      default:
        aliases: [backend-prod]
  frontend:
    networks:
      default:
        aliases: [frontend-prod]
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - default
      - staging
    volumes:
      - media-staging:/srv/media-staging:ro

networks:
  # Subnet cố định để TRUSTED_PROXY_CIDRS không đổi khi tạo lại mạng (van-hanh.md 3, "Tin header IP").
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  staging:
    name: vyc-staging
    external: true

volumes:
  media-staging:
    name: vyc-staging_media
    external: true
