# Phần chung cho mọi môi trường (docs/kien-truc/van-hanh.md mục 2).
# Dùng kèm compose.dev.yml (dev), hoặc compose.prod.yml + compose.edge.yml (prod), hoặc
# compose.prod.yml + compose.staging.yml (staging). compose.ci.yml chỉ cho CI.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vyc}
      POSTGRES_USER: ${POSTGRES_USER:-vyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong env-file}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      - -c
      - work_mem=8MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    restart: unless-stopped
    mem_limit: 768m
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?cần đặt ENVIRONMENT (dev, staging hoặc prod)}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?đặt DJANGO_SECRET_KEY trong env-file}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:4321}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      IP_HASH_SALT: ${IP_HASH_SALT:?đặt IP_HASH_SALT trong env-file}
      DATABASE_URL: postgres://${POSTGRES_USER:-vyc}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong env-file}@postgres:5432/${POSTGRES_DB:-vyc}
      MEDIA_ROOT: /data/media
      MEDIA_PRIVATE_ROOT: /data/media-private
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
    volumes:
      - media:/data/media
      - media-private:/data/media-private
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    mem_limit: 384m
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NODE_OPTIONS: --max-old-space-size=256
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      GTM_ID: ${GTM_ID:-}
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  media-private:
