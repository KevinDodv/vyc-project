f; }\n  header { background: var(--que-dark); color: #fff; padding: 14px 18px; font-weight: 800; letter-spacing: .3px; font-size: 19px; }\n  header a { color: #fff; text-decoration: none; }\n  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }\n  .status { border-radius: 16px; padding: 18px; margin-bottom: 16px; font-weight: 700; display: flex; gap: 12px; align-items: center; font-size: 19px; }\n  .status .ic { font-size: 30px; line-height: 1; }\n  .status.ok { background: #e3f4e8; color: var(--ok); }\n  .status.bad { background: #fde8e6; color: var(--err); border: 2px solid var(--err); }\n  .status.warn { background: #fff4d6; color: var(--warn); }\n  .card { background: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(60,30,10,.08); }\n  .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--que); margin: 0 0 8px; }\n  .product { display: flex; gap: 14px; align-items: center; }\n  .product img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; background: #eee; }\n  .product h1 { font-size: 21px; margin: 0; }\n  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }\n  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }\n  .photos { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }\n  .photos img { height: 120px; border-radius: 10px; }\n  .btn { display: block; text-align: center; background: var(--que); color: #fff; padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 18px; }\n  .muted { color: var(--muted); font-size: 15px; }\n  .code { font-family: ui-monospace, Consolas, monospace; letter-spacing: .5px; }\n  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-weight: 800; font-size: 16px; margin-bottom: 10px; }\n  .pill.sold { background: #e3f4e8; color: var(--ok); }\n  .pill.unsold { background: #fff4d6; color: var(--warn); }\n  .note { color: var(--muted); font-size: 13.5px; margin-top: 10px; }\n  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 20px; }\n  input { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ddd; text-transform: uppercase; }\n  button { font: inherit; }\n<\/style>\n<\/head>\n<body>\n<header><a href=\"/\">Quế Văn Yên<\/a><\/header>\n<main>\n<div class=\"card\">\n  <h2>Tra cứu nguồn gốc<\/h2>\n  <p>Nhập mã 10 ký tự in dưới tem QR (ví dụ K7Q2-MX9P-AT).<\/p>\n  <form method=\"get\" action=\"/truy-xuat\"><input name=\"ma\" required=\"\" maxlength=\"20\" autocomplete=\"off\" placeholder=\"Mã trên tem\" value=\"\">\n  <p><button class=\"btn\" style=\"width:100%;border:0\">Kiểm tra<\/button><\/p><\/form>\n<\/div>\n<\/main>\n<footer>Quế Văn Yên<\/footer>\n\n<\/body><\/html>", "key": "q-form"}]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const S = D.screens, byKey = Object.fromEntries(S.map((s, i) => [s.key, i]));
  let cur = 0;
  const INJECT = `<script>
    document.addEventListener("click", function (e) {
      var a = e.target.closest("a");
      if (a) { e.preventDefault(); parent.postMessage({ go: a.getAttribute("href") }, "*"); return; }
      var b = e.target.closest("button");
      if (b) { e.preventDefault(); parent.postMessage({ hint: "Bản xem trước: nút “" + b.textContent.trim().slice(0, 40) + "” không chạy thật" }, "*"); }
    }, true);
    document.addEventListener("submit", function (e) { e.preventDefault(); }, true);
  <\/script>`;
  function docFor(s) {
    let h = s.html.replace("<!--APPCSS-->", "<style>" + D.css + "</style>");
    return h.replace("</body>", INJECT + "</body>");
  }
  function route(href, group) {
    if (!href || href.startsWith("http") || href.startsWith("tel:")) return null;
    const owner = group === "Chủ doanh nghiệp";
    const p = href.split("?")[0];
    const map = [
      [/^\/$/, owner ? "home_owner" : "home_shop"], [/^\/logout/, "login"], [/^\/login/, "login"],
      [/^\/nhap-hang/, "receipt_1"], [/^\/phieu-nhap/, "receipt_list"], [/^\/xuat-hang\/que-kho/, "issue_dry"],
      [/^\/xuat-hang\/don-hang/, "issue_product"], [/^\/xuat-hang/, "issue_menu"], [/^\/don-hang/, "issue_list"],
      [/^\/ton-kho/, "inv_nl"], [/^\/san-xuat\/\d+/, "prod_order"], [/^\/san-xuat/, owner ? "prod_owner" : "prod_list"],
      [/^\/dong-goi/, "labels"], [/^\/quan-ly\/bang-gia/, "prices"], [/^\/quan-ly\/danh-muc\/nguoi-ban/, "suppliers"],
      [/^\/quan-ly\/danh-muc\/san-pham/, "products"], [/^\/quan-ly\/danh-muc\/cai-dat/, "settings"], [/^\/quan-ly\/danh-muc/, "admin"],
      [/^\/quan-ly\/cuon-tem/, "rolls"], [/^\/quan-ly\/lo-thanh-pham/, "plots_lots"], [/^\/quan-ly\/tra-cuu/, "trace"],
      [/^\/quan-ly\/khach-hang/, "buyers"], [/^\/quan-ly\/bao-cao/, "reports"], [/^\/quan-ly\/vung-nguyen-lieu/, null],
      [/^\/quan-ly/, "admin"], [/^\/q\//, "q_ok"], [/^\/truy-xuat/, "q_form"], [/^\/$/, "q_ok"]];
    for (const [re, k] of map) if (re.test(p)) return k;
    return null;
  }
  function hint(t) { const h = document.getElementById("hint"); h.textContent = t; h.classList.add("show"); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove("show"), 2200); }
  window.addEventListener("message", (e) => {
    if (!e.data) return;
    if (e.data.hint) return hint(e.data.hint);
    if (e.data.go !== undefined) {
      const k = route(e.data.go, S[cur].group);
      if (k && k.replace(/_/g, "-") in byKey) show(byKey[k.replace(/_/g, "-")]); else hint("Màn hình này không có trong bản xem trước");
    }
  });
  const nav = document.getElementById("nav");
  let g = null;
  S.forEach((s, i) => {
    if (s.group !== g) { g = s.group; const h = document.createElement("h3"); h.textContent = g; nav.append(h); }
    const b = document.createElement("button");
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span>`; b.append(s.title);
    b.onclick = () => { show(i); document.body.classList.remove("menu"); };
    nav.append(b);
  });
  function show(i) {
    cur = (i + S.length) % S.length;
    const s = S[cur], view = document.getElementById("view");
    view.innerHTML = "";
    const f = document.createElement("iframe");
    f.title = s.title;
    if (s.kind === "phone") {
      const w = document.createElement("div"); w.className = "phone-wrap";
      const ph = document.createElement("div"); ph.className = "phone";
      const n = document.createElement("div"); n.className = "notch";
      ph.append(n, f); w.append(ph); view.append(w);
    } else { f.className = "app"; view.append(f); }
    f.srcdoc = docFor(s);
    document.getElementById("title").textContent = s.title;
    document.getElementById("grp").textContent = s.group;
    document.getElementById("pos").textContent = `${cur + 1} / ${S.length}`;
    nav.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === cur));
    const on = nav.querySelector("button.on"); if (on) on.scrollIntoView({ block: "nearest" });
    try { history.replaceState(null, "", "#" + s.key); } catch (e) {}
  }
  document.getElementById("prev").onclick = () => show(cur - 1);
  document.getElementById("next").onclick = () => show(cur + 1);
  document.getElementById("menu").onclick = () => document.body.classList.toggle("menu");
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
  const start = location.hash.slice(1);
  show(start in byKey ? byKey[start] : byKey["home-shop"] ?? 0);
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k in byKey && byKey[k] !== cur) show(byKey[k]); });
})();
</script>
