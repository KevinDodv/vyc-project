<title>Bản xem trước — Hệ thống Quế Văn Yên</title>
<style>

-bottom: .6rem; }\n.step-title .n { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--que); color: #fff; margin-right: .5rem; font-size: .95rem; }\ntable { width: 100%; border-collapse: collapse; background: #fff; }\nth, td { padding: .55rem .6rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }\nth { background: #f3ece4; font-size: .9rem; color: #4a3f36; }\ntd.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }\ntr.clickable { cursor: pointer; }\ntr.clickable:hover td { background: var(--que-soft); }\ntr.clickable td { padding-top: .8rem; padding-bottom: .8rem; }\ntr.warn td { background: #fff1e0; }\n.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); }\n.tag { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .9rem; font-weight: 700; background: #eee; color: #444; white-space: nowrap; }\n.tag.CONTROLLED, .tag.ok { background: var(--ok-soft); color: var(--ok); }\n.tag.GENERAL { background: var(--general-soft); color: var(--general); }\n.tag.warn, .tag.RESERVED, .tag.DRAFT, .tag.UNASSIGNED { background: var(--warn-soft); color: var(--warn); }\n.tag.err, .tag.CANCELLED, .tag.RECALLED, .tag.VOID { background: var(--err-soft); color: var(--err); }\n.tag.IN_STOCK, .tag.ACTIVE, .tag.DONE, .tag.SAVED, .tag.PUBLISHED { background: var(--ok-soft); color: var(--ok); }\n.tag.gift { background: #fbe7f3; color: #9b1b63; }\n.money { font-variant-numeric: tabular-nums; white-space: nowrap; }\n\n/* ---------- thông báo */\n.banner { border-radius: 10px; padding: .8rem 1rem; margin: .6rem 0; font-weight: 600; }\n.banner.warn { background: var(--warn-soft); color: #6b4500; border: 1px solid #f0d58a; }\n.banner.err { background: var(--err-soft); color: var(--err); border: 1px solid #f5b5ae; }\n.banner.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid #a8dcb7; }\n.banner >\n  <div class=\"title\">Lệnh sản xuất<\/div>\n  <div class=\"who\">Thủ kho (mẫu) · Xưởng<a href=\"/logout\">Đăng xuất<\/a><\/div>\n<\/header>\n<main>\n\n<div id=\"head\" class=\"card\"><div><div style=\"font-size: 1.4rem; font-weight: 800;\">Túi thơm vỏ quế Văn Yên 25 g<\/div><div class=\"muted\">LSX-2611-003 · ngày 20/11/2026 · <span class=\"tag DRAFT\">Nháp<\/span><\/div><div>Túi thơm đợt quà Tết<\/div><\/div><\/div>\n\n<section class=\"card\">\n  <div class=\"step-title\"><span class=\"n\">1<\/span>Mẻ này làm gì<\/div>\n  <div style=\"font-size:1.15rem\">Làm <b>40 túi<\/b> (1.100 g) theo công thức <b>Túi vỏ quế 25 g (TUI v1)<\/b>. Ủ 5–7 ngày sau khi pha. <span class=\"muted\">Chủ doanh nghiệp đã chọn lúc tạo lệnh.<\/span><\/div>\n<\/section>\n\n<section class=\"card\" data-rows>\n  <div class=\"step-title\"><span class=\"n\">2<\/span>Cân và ghi từng thứ <small class=\"muted\" style=\"font-weight:500\">(xong 3/4 thứ)<\/small><\/div>\n  <p class=\"muted\" style=\"margin-top:0\">Quét tem lô, rồi gõ số cân. Cân sai thì ghi số thật, không múc bớt ra. Nhớ bấm TARE (trừ bì) trước mỗi thứ; cân chính xác 0,01 g.<\/p>\n\n  <div class=\"ing done\">\n    <div class=\"ing-h\"><span class=\"ing-name\">Vỏ quế cắt hạt<\/span><span class=\"tag ok\">Đủ ✔<\/span><\/div>\n    <div class=\"ing-need\">Cân 480,00 g<\/div>\n    <div class=\"ing-meta\">Lô VQH-2611-01 · đã cân 480,02 g<\/div>\n    <button data-act=\"row-del\" class=\"small\" style=\"margin-top:.5rem\">Bỏ dòng này<\/button>\n  <\/div>\n\n  <div class=\"ing done\">\n    <div class=\"ing-h\"><span class=\"ing-name\">Dăm gỗ<\/span><span class=\"tag ok\">Đủ ✔<\/span><\/div>\n    <div class=\"ing-need\">Cân 320,00 g<\/div>\n    <div class=\"ing-meta\">Lô DG-2611-01 · đã cân 320,00 g<\/div>\n    <button data-act=\"row-del\" class=\"small\" style=\"margin-top:.5rem\">Bỏ dòng này<\/button>\n  <\/div>\n\n  <div class=\"ing now\" id=\"ing-ht\">\n    <div class=\"ing-h\"><span class=\"ing-name\">Hạt thạch cao<\/span><span class=\"tag warn\">Chưa cân<\/span><\/div>\n    <div class=\"ing-need\">Cân 200,00 g<\/div>\n    <div class=\"ing-meta\">Lấy lô HT-2611-01 (hạn gần nhất, còn đủ tồn)<\/div>\n    <label>Quét tem lô<\/label>\n    <input class=\"scan-input\" placeholder=\"Quét tem lô HT-…\" value=\"\" autocomplete=\"off\">\n    <details class=\"dt\">\n      <summary>Tem không quét được? Chọn lô<\/summary>\n      <div class=\"in pick\"><button type=\"button\" data-pick class=\"choice\">HT-2611-01<span class=\"sub\">hạn gần nhất<\/span><\/button><button type=\"button\" data-pick class=\"choice\">HT-2610-02<span class=\"sub\">còn ít<\/span><\/button><\/div>\n    <\/details>\n    <label>Số cân thực tế (g)<\/label>\n    <button type=\"button\" data-pick class=\"small\" style=\"margin-bottom:.5rem\">Điền sẵn số cân theo gợi ý (200,00 g)<\/button>\n    <input class=\"big-number\" inputmode=\"decimal\" placeholder=\"0,00\" value=\"\">\n    <div class=\"ing-meta\" style=\"margin-top:.3rem\">Quét xong, con trỏ tự nhảy xuống ô số cân. Gõ số thật rồi Enter để sang thứ kế tiếp, hoặc bấm nút trên để điền sẵn số gợi ý.<\/div>\n    <details class=\"dt\" style=\"margin-top:.6rem\">\n      <summary>Xem ô sau khi bấm «Điền sẵn»<\/summary>\n      <div class=\"in\">\n        <div style=\"display:flex;align-items:center;gap:.6rem;flex-wrap:wrap\"><input class=\"big-number\" style=\"opacity:.55;font-style:italic;max-width:220px\" value=\"200,00\" readonly><span class=\"tag warn\">gợi ý<\/span><\/div>\n        <div class=\"need-line\" style=\"margin-top:.4rem\">Số này chỉ là gợi ý, chưa lưu. Cân thật rồi gõ số thật nếu khác. Bấm «Xác nhận số cân» mới ghi.<\/div>\n        <button type=\"button\" data-go=\"#cure-list\" style=\"margin-top:.5rem;min-height:64px\">Xác nhận số cân<\/button>\n      <\/div>\n    <\/details>\n  <\/div>\n\n  <div class=\"ing off\">\n    <div class=\"ing-h\"><span class=\"ing-name\">Dung dịch tẩm<\/span><span class=\"tag warn\">Hơi lệch<\/span><\/div>\n    <div class=\"ing-need\">Cân 100,00 g<\/div>\n    <div class=\"ing-meta\">Lô DDT-2611-01 · đã cân 100,09 g<\/div>\n    <div class=\"need-line\" style=\"margin-top:.4rem\">Nhiều hơn 0,09 g so với cần cân (cho phép 0,05 g). Vẫn lưu được.<\/div>\n    <button data-act=\"row-del\" class=\"small\">Bỏ dòng này<\/button>\n  <\/div>\n\n  <div class=\"kpis\" style=\"margin:.4rem 0 .8rem\">\n    <div class=\"kpi\"><div class=\"v\">900,11 g<\/div><div class=\"l\">đã cân, cần 1.100,00 g<\/div><\/div>\n    <div class=\"kpi\"><div class=\"v\">3/4<\/div><div class=\"l\">thứ đã xong<\/div><\/div>\n  <\/div>\n  <button data-act=\"row-add\">+ Thêm phụ liệu ngoài công thức<\/button>\n  <p class=\"muted\" style=\"margin-bottom:0\">Túi thơm lấy vỏ quế từ lô bán thành phẩm VQH nên không có bước «chọn loại sau sàng».<\/p>\n  <div class=\"annot\"><b>Sếp chốt (B2-17):<\/b> vẫn quét tem lô cho mọi thứ (truy xuất lô phụ liệu, BR-01/BR-27); chỉ có nút «Tem không quét được? Chọn lô» khi tem hỏng. <b>Sếp chốt LÀM (B2-18):<\/b> nút «Điền sẵn số cân theo gợi ý» ở mỗi thẻ thành phần. Số điền sẵn hiện mờ, nghiêng, kèm nhãn «gợi ý»; người dùng vẫn phải cân thật, sửa nếu khác, rồi bấm «Xác nhận số cân». Máy chủ chỉ lưu số đã xác nhận, không coi gợi ý là số cân.<\/div>\n<\/section>\n\n<section class=\"card\">\n  <div class=\"step-title\"><span class=\"n\">3<\/span>Pha xong thì đưa vào ủ<\/div>\n  <div class=\"need-line\">Còn thiếu: Hạt thạch cao ↑<\/div>\n  <button class=\"primary bigbtn\" data-go=\"#cure-list\" disabled>▶ Đã pha xong, đưa vào ủ<\/button>\n  <p class=\"muted\" style=\"margin-bottom:0\">Mã mẻ <span class=\"mono\">TUI-261120-01<\/span> ra khi bấm. Sớm nhất ủ xong 25/11/2026 (5 ngày).<\/p>\n  <div class=\"annot\">Đủ 4 thứ thì nút xanh sáng lên. Bấm xong: hiện «Đã đưa vào ủ. Dán tem TUI-261120-01 lên lọ.» rồi quay về màn Sản xuất. Phần «Nhập kết quả» không hiện ở đây; nó nằm ở màn riêng khi mẻ ủ đủ ngày.<\/div>\n<\/section>\n\n<\/main>\n<div id=\"toast\"><\/div>\n<\/body><\/html>\n", "key": "prod-order"}, {"title": "Mẻ đang ủ", "  tem lô này. Bấm «Để sau»: vẫn sang in tem (không chặn), hiện «Nhớ lưu mẫu sau, việc này nằm ở trang chủ», lô nằm ở «Lô chưa lưu mẫu».<\/div>\n<\/section>\n<section class=\"card\">\n  <div class=\"step-title\">Tem cho lô này<\/div>\n  <p style=\"margin-top:0\">Tem in theo lô và gán luôn vào lô <b>QC2-261023-01<\/b>: một bộ toàn trình nối từ lô nguyên liệu, qua mẻ, tới lô thành phẩm và từng tem. Thiếu tem thì in bổ sung đúng theo lô này.<\/p>\n  <a class=\"btn bigbtn\" href=\"/quan-ly/cuon-tem\">🖨 In tem cho 90 chai<\/a>\n  <div class=\"annot\"><b>Sếp chốt (#494 ý 7).<\/b> Thay cho bước quét tem đầu/cuối ở màn «Gán tem / hủy tem» (B/18). Nút này trỏ tới màn in tem theo lô (A1, cụm C); chỉ còn một nút xanh ở trên (lưu mẫu), nút này viền nâu cho đúng chuẩn mỗi màn một nút chính.<\/div>\n<\/section>\n\n<\/main>\n<div id=\"toast\"><\/div>\n<\/body><\/html>\n", "key": "prod-done"}, {"title": "Gán bù / hủy tem: quét tem đầu, tem cuối của đoạn tem rời", "group": "Xưởng", "kind": "app", "html": "<!doctype html><html lang=\"vi\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"csrf\" content=\"Rc0_mgBGOnoJ9VLGZmwHvIVY-aHp-cG8\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<title>Gán tem / hủy tem · Quế Văn Yên<\/title>\n<!--APPCSS-->\n<style>\n.annot{border:2px dashed var(--line);border-radius:var(--radius);padding:.6rem .9rem;color:var(--muted);font-size:.9rem;margin:.6rem 0}\n.rowerr td{background:var(--err-soft)}\n.rowwarn td{background:#fff8e6}\n.dim{opacity:.55}\n.chips{display:flex;flex-wrap:wrap;gap:.5rem}\n.chip{min-height:48px;border:2px solid var(--line);border-radius:10px;padding:.3rem .7rem;background:#fff;display:flex;gap:.4rem;align-items:center;font-variant-numeric:tabular-nums}\n.chip.due{border-color:#f0d58a;background:var(--warn-soft)}\ntd input,td select{min-height:48px;padding:.3rem .5rem}\ntd input.g{text-align:right;font-variant-numeric:tabular-nums;width:130px}\n.dot{disp banner ok\" style=\"margin-top:0\">Bước 1/2 xong: tem ĐẦU của cuộn là P0TF-3C35-MQ ✔<\/div>\n    <button class=\"small\">Quét lại tem đầu<\/button>\n    <div class=\"step-title\" id=\"scan-title\" style=\"font-size:1.3rem;margin-top:1rem\">Bước 2/2: quét tem CUỐI của đoạn tem<\/div>\n    <input id=\"scan\" class=\"scan-input\" placeholder=\"Quét tem…\" autocomplete=\"off\" value=\"\">\n    <div id=\"msg\" aria-live=\"polite\"><\/div>\n    <div class=\"annot\">Mới vào màn này chỉ hiện «Bước 1/2: quét tem ĐẦU của cuộn»; quét xong mới hiện bước 2. Quét tem cuối xong tự gán, không cần bấm nút. Thông báo hiện ở ô trống phía trên, ví dụ:\n      <div class=\"banner ok\" style=\"margin:.4rem 0 0\">Đã gán 50 tem, lô này xong.<\/div>\n      <div class=\"banner err\" style=\"margin:.4rem 0 0\">Chưa gán được: hai tem không cùng một cuộn. Quét lại tem đầu.<\/div>\n      <div class=\"banner err\" style=\"margin:.4rem 0 0\">Chưa gán được: có tem đã dùng cho lô khác.<\/div><\/div>\n  <\/div>\n<\/section>\n<section id=\"tab-void\" class=\"hidden\">\n  <div class=\"card\">\n    <div class=\"step-title\">Quét tem rách hoặc in hỏng<\/div>\n    <div class=\"choice-grid\" id=\"reasons\"><button type=\"button\" data-pick class=\"choice selected\">Tem rách<\/button><button type=\"button\" data-pick class=\"choice\">In hỏng<\/button><button type=\"button\" data-pick class=\"choice\">Dán nhầm<\/button><button type=\"button\" data-pick class=\"choice\">Mất tem<\/button><\/div>\n    <input id=\"void-scan\" class=\"scan-input\" placeholder=\"Quét tem cần hủy…\" autocomplete=\"off\" style=\"margin-top:.6rem\" value=\"\">\n    <div id=\"void-msg\"><\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n<div id=\"toast\"><\/div>\n<\/body><\/html>\n", "key": "labels"}, {"title": "Trang chủ chủ DN (người bán chờ duyệt)", "group": "Chủ doanh nghiệp", "kind": "app", "html": "<!doctype html><html lang=\"vi\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">  10 ml<span class=\"sub\">lần trước làm<\/span><\/button>\n      <button type=\"button\" data-pick class=\"choice\">Tinh dầu Quế Cam dịu nhẹ 10 ml<\/button>\n      <button type=\"button\" data-pick class=\"choice\">Tinh dầu Quế Văn Yên 100% 10 ml<\/button>\n      <button type=\"button\" data-pick class=\"choice\">Túi thơm vỏ quế Văn Yên 25 g<\/button>\n      <button type=\"button\" data-pick class=\"choice\">Sáp thơm quế 55 g<\/button>\n      <button type=\"button\" data-pick class=\"choice\">Viên thơm thạch cao 20 g<\/button>\n      <button type=\"button\" class=\"choice\" disabled>Trà quế Văn Yên 100 g<span class=\"sub\">giai đoạn 4, chờ giấy tờ ATTP<\/span><\/button>\n    <\/div>\n    <p style=\"margin:.8rem 0 0\">Công thức: <b>QC2 v1<\/b> · ủ 28 ngày (đang dùng)<\/p>\n    <div class=\"annot\"><b>Nhóm lựa chọn (B2-05).<\/b> Công thức có nhóm lựa chọn (dung dịch tẩm, sáp thơm) thì hiện thêm hai nút to, bắt chọn một, và nút «Tạo lệnh» xám cho tới khi chọn: <span class=\"choice-grid\" style=\"display:inline-flex;vertical-align:middle\"><button type=\"button\" data-pick class=\"choice\" style=\"min-height:48px\">TT1 dầu nhẹ<\/button><button type=\"button\" data-pick class=\"choice\" style=\"min-height:48px\">TT2 đậm đà<\/button><\/span> QC2 không có nhóm này.<\/div>\n\n    <label>Làm bao nhiêu?<\/label>\n    <div class=\"choice-grid\"><button type=\"button\" data-pick class=\"choice\">100 ml<\/button><button type=\"button\" data-pick class=\"choice\">500 ml<\/button><button type=\"button\" data-pick class=\"choice selected\">1 lít<\/button><button type=\"button\" data-pick class=\"choice\">Số khác…<\/button><\/div>\n    <div class=\"muted\">1 lít = 921,7 g (máy tự tính). Túi thơm: nút «40 túi» (mẻ chuẩn).<\/div>\n    <details class=\"dt\"><summary>Số khác (gõ số gram)<\/summary><div class=\"in\"><input class=\"big-number\" inputmode=\"decimal\" value=\"921,7\"><\/div><\/details>\n\n    <div class=\"table-wrap\" style=\"margin-top:.8rem\"><table>\n      <thead><tr><th>Lượng cân gợi ý<\/th><th class=\"num\">Mẻ chuẩn (g)<\/th><th class=\"num\">Cỡ mẻ này (g)<\/th><\/tr><\/thead>\n      <tbody><tr><td>Tuyết tùng Virginia<\/td><td class=\"num\">36,87<\/td><td class=\"num\">368,70<\/td><\/tr><tr><td>Dầu quế đã ủ<\/td><td class=\"num\">18,43<\/td><td class=\"num\">184,30<\/td><\/tr><tr><td>Cam ngọt<\/td><td class=\"num\">36,87<\/td><td class=\"num\">368,70<\/td><\/tr><\/tbody>\n      <tfoot><tr><td><b>Tổng<\/b><\/td><td class=\"num\"><b>92,17<\/b><\/td><td class=\"num\"><b>921,70<\/b><\/td><\/tr><\/tfoot>\n    <\/table><\/div>\n\n    <p style=\"margin:.8rem 0 .2rem\">Ngày làm: <b>hôm nay 20/11/2026<\/b><\/p>\n    <details class=\"dt\"><summary>Đổi ngày<\/summary><div class=\"in\"><input type=\"date\" id=\"date\" value=\"2026-11-20\"><\/div><\/details>\n    <details class=\"dt\"><summary>+ Thêm ghi chú<\/summary><div class=\"in\"><input id=\"note\" value=\"\" placeholder=\"Ghi chú (không bắt buộc)\"><\/div><\/details>\n\n    <p style=\"margin:1rem 0 0\"><button class=\"primary bigbtn\" id=\"create\" data-go=\"/san-xuat/3\">Tạo lệnh<\/button><\/p>\n  <\/section>\n<\/details>\n\n<h2>Lệnh đang làm<\/h2>\n\n<div class=\"jobs\">\n  <div class=\"job\">\n    <div class=\"jt\">Túi thơm vỏ quế Văn Yên 25 g<\/div>\n    <div class=\"js\">Lệnh LSX-2611-003 · đã cân 3/4 thành phần<\/div>\n    <div class=\"jx\">Còn thiếu: Hạt thạch cao<\/div>\n    <a class=\"btn primary\" href=\"/san-xuat/3\">Làm tiếp<\/a>\n  <\/div>\n<\/div>\n<h2>Mẻ đang ủ<\/h2>\n<div class=\"jobs\">\n  <div class=\"job\">\n    <div class=\"jt\">Tinh dầu Quế Cam đậm đà 10 ml<\/div>\n    <div class=\"js\">Mẻ QC2-261023-02 · ủ xong ngày 20/11/2026<\/div>\n    <div class=\"jx\"><span class=\"tag ok\">Đủ ngày ủ<\/span> Chờ ngửi kiểm tra<\/div>\n    <a class=\"btn primary\" href=\"/san-xuat/ua/1/ngui\">Ngửi kiểm tra<\/a>\n  <\/div>\n  <div class=\"job due\">\n    <div class=\"jt\">Tinh dầu Quế Cam dịu nhẹ 10 ml<\/div>\n    <div class=\"js\">Mẻ QC1-261117-01 · còn 18 ngày (xong 08/12/2026)<\/div>\n    <div class=\"jx\">Hôm nay đến lượt lắc chai<\/div>\n    <button class=\"primary\" data-pick>Đã lắc chai hôm nay<\/button>\n    <div class=\"js\">Bấm là ghi người đăng nhập và giờ lắc.<\/div>\n    <a class=\"btn\" href=\"/san-xuat/ua/4\">Xem chi tiết<\/a>\n  <\/div>\n<\/div>\n<p><a class=\"btn\" href=\"/san-xuat/ua\">Xem tất cả mẻ đang ủ (4)<\/a><\/p>\n<h2>Lô thành phẩm cần gán tem<\/h2>\n<div class=\"jobs\">\n  <div class=\"job\">\n    <div class=\"jt\">Tinh dầu Quế Văn Yên 100% 10 ml<\/div>\n    <div class=\"js\">Lô Q100-261120-02 · đã gán 150/200<\/div>\n    <div class=\"jx\">Còn 50 tem cần gán<\/div>\n    <a class=\"btn primary\" href=\"/dong-goi?lot=2\">Gán tem<\/a>\n  <\/div>\n  <div class=\"job\">\n    <div class=\"jt\">Tinh dầu Quế Cam đậm đà 10 ml<\/div>\n    <div class=\"js\">Lô QC2-261023-01 · đã gán 0/90<\/div>\n    <div class=\"jx\">Còn 90 tem cần gán<\/div>\n    <a class=\"btn primary\" href=\"/dong-goi?lot=3\">Gán tem<\/a>\n  <\/div>\n<\/div>\n<p><a class=\"btn\" href=\"/dong-goi\">Gán tem / hủy tem lỗi<\/a><\/p>\n\n<\/main>\n<div id=\"toast\"><\/div>\n<\/body><\/html>\n", "key": "prod-owner"}, {"title": "In tem theo lô (gán luôn, in bổ sung); cuộn tự do chỉ chủ", "group": "Chủ doanh nghiệp", "kind": "app", "html": "<!doctype html><html lang=\"vi\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"csrf\" content=\"Ux4yLWS1Y-dqxGaCvpCjdj2os5TDAE-v\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<title>In tem · Quế Văn Yên<\/title>\n<!--APPCSS-->\n<style>\n/* UX cụm C (#37): khối dùng riêng trong cụm C, chờ chuyển vào app.css chung */\n.todo{display:grid;gap:.6rem;margin:1rem 0}\n.todo-item{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:12px;background:var(--warn-soft);border:1px solid #f0d58a;font-weight:600}\n.todo-item.info{background:#eef4fb;border-color:#c9dbef}\n.todo-item .btn{margin-left:auto;min-height:48px;flex:0 0 auto}\n.range-btns{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0}\n.range-btns .choice{min-height:56px;min-width:120px}\n.cta{display:flex;width:100%;min-height:72px;font-size:1.3rem;justify-content:center;align-items:center;gap:.6rem;text-decoration:none}\n.sub-note{font-size:1rem;color:var(--muted);margin:.2rem 0 0;font-weight:400}\n/* Bộ toàn trình: lô nguyên liệu → mẻ → lô thành phẩm → dải serial */\n.chain{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:.5rem 0 .8rem}\n.chain .nd{background:#fff;border:1px solid #c9b7a3;border-radius:10px;padding:.35rem .7rem;font-weight:700;font-size:1rem}\n.chain .nd small{display:block;font-weight:400;color:var(--muted);font-size:1rem}\n.chain .ar{color:var(--que);font-weight:800;font-size:1.2rem}\n.lot-row{border:1px solid #e3d6c6;border-radius:12px;padding:1rem;margin:.8rem 0;background:#fff}\n.lot-row h3{margin:0 0 .2rem;font-size:1.15rem}\n.lock{display:inline-block;background:#f1e6d8;border-radius:8px;padding:.1rem .6rem;font-size:1rem;font-weight:600;color:#6b4a2b}\n<\/style>\n<link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiM4YTNiMTIiLz48cGF0aCBkPSJNMTggNDZjNi0xOCAxNi0yNiAyOC0yOC00IDEwLTEyIDIyLTI4IDI4eiIgZmlsbD0iI2Y2ZTdkYSIvPjwvc3ZnPgo=\">\n<\/head>\n<body>\n<header class=\"topbar\">\n  <a class=\"back\" href=\"/\">← Về trang chủ<\/a>\n  <div class=\"title\">In tem<\/div>\n  <div class=\"who\">Thủ kho (mẫu) · Thủ kho<a href=\"/logout\">Đăng xuất<\/a><\/div>\n<\/header>\n<main>\n<section class=\"card\">\n  <div class=\"step-title\">Lô cần in tem<\/div>\n  <p class=\"muted\" style=\"margin-top:0\">Bấm một nút: máy tạo đúng số tem của lô, in ra và gán luôn cho lô đó. Không phải quét tem đầu, tem cuối. Máy ghi lại ai in và lúc nào.<\/p>\n\n  <div class=\"lot-row\">\n    <h3>Lô QC2-261023-01 · Tinh dầu Quế Cam đậm đà 10 ml · 90 chai chưa có tem<\/h3>\n    <div class=\"c ch<\/button>\n        <button data-pick class=\"choice\" type=\"button\">Dán lệch, bóc ra<\/button>\n        <button data-pick class=\"choice\" type=\"button\">Khác…<\/button>\n      <\/div>\n      <a class=\"btn primary cta\" id=\"print-extra\" href=\"/in/tem-bo-sung?lo=Q100-261120-02&amp;n=50\">🖨 In bổ sung 50 tem<\/a>\n      <div class=\"sub-note\">Ghi lại: Thủ kho (mẫu) · lúc bấm in · lý do đã chọn. Tem đã in mà hỏng, rách cũng in bổ sung ở đây; tem cũ tự hủy.<\/div>\n    <\/details>\n  <\/div>\n  <div class=\"muted\" style=\"margin-bottom:0\">Mã QR dẫn tới quevanyen.vn. Tem đã in thì không đổi được. <details style=\"display:inline-block;vertical-align:top\"><summary style=\"display:inline-flex;min-height:48px\">ⓘ Chi tiết<\/summary><span class=\"muted\">Đường dẫn trong QR: https://quevanyen.vn/q/&lt;mã&gt;. Khổ tem 50 × 30 mm. Tên miền chốt ở Cài đặt, khóa sau khi in cuộn đầu tiên (đã in ngày 20/11/2026).<\/span><\/details><\/div>\n<\/section>\n\n<section class=\"card\" style=\"margin-top:1rem\">\n  <div class=\"step-title\">Lịch sử in tem theo lô<\/div>\n  <div class=\"table-wrap\"><table>\n    <thead><tr><th>Lô<\/th><th class=\"num\">Tem<\/th><th>Người in<\/th><th>Lúc in<\/th><th>Lý do<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td class=\"mono\">Q100-261120-02<\/td><td class=\"num\">1–150<\/td><td>Chủ DN<\/td><td>19:41 20/11/2026<\/td><td>In lần đầu<\/td><\/tr>\n      <tr><td class=\"mono\">QC2-261023-01<\/td><td class=\"num\">chưa in<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr>\n    <\/tbody>\n  <\/table><\/div>\n<\/section>\n\n<section class=\"card\" data-role=\"OWNER\" style=\"margin-top:1rem\">\n  <div class=\"step-title\">In cuộn tem tự do <span class=\"lock\">🔒 Chỉ chủ<\/span><\/div>\n  <p class=\"muted\" style=\"margin-top:0\">Dùng khi cần in sẵn một cuộn dài, chưa gắn với lô nào. Thủ kho không thấy mục này; thủ kho in theo lô ở trên.<\/p>\n  <div class=\"row\"><div style=\"flex:0 0 260px\"><label>Số tem cần in<\/label><input id=\"n\" type=\"number\ ick id=\"go\" type=\"button\">Tra cứu<\/button><\/div><\/div>\n<details style=\"margin-top:.4rem\"><summary>Các loại mã ▾<\/summary><div class=\"card muted\" style=\"margin:.4rem 0\">Tem trên chai: dạng <b>XXXX-XXXX-XX<\/b> · Lô thành phẩm: <b>QC2-261023-01<\/b>, <b>Q100-261120-02<\/b> · Lô quế: <b>NL-…<\/b> · Phiếu nhập: <b>PN-…<\/b> · Phiếu xuất: <b>PX-…<\/b> · Người bán: <b>NCC-…<\/b><br>Quét máy quét hoặc bấm Enter là tự tra, không cần bấm «Tra cứu».<\/div><\/details>\n<div id=\"out\" style=\"margin-top:1rem\"><h2>Người bán Gia đình (đồi nhà) (NCC-CQ-001)<\/h2><div class=\"banner ok\" style=\"font-size:1.1rem\">Quế của người bán này (85 kg) đã vào lô <b>Q100-261120-02<\/b>: 200 chai, đã xuất 5 chai, còn 145 chai trong kho.<\/div><div class=\"card\"><div class=\"step-title\">Bộ toàn trình của lô Q100-261120-02<\/div><div class=\"chain\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:.4rem\"><span style=\"background:#fff;border:1px solid #c9b7a3;border-radius:10px;padding:.35rem .7rem;font-weight:700\"><small style=\"display:block;font-weight:400;color:var(--muted)\">Lô nguyên liệu<\/small>NL-2611-0004<\/span><b style=\"color:var(--que)\">→<\/b><span style=\"background:#fff;border:1px solid #c9b7a3;border-radius:10px;padding:.35rem .7rem;font-weight:700\"><small style=\"display:block;font-weight:400;color:var(--muted)\">Mẻ<\/small>LSX-2611-002<\/span><b style=\"color:var(--que)\">→<\/b><span style=\"background:#fff;border:1px solid #c9b7a3;border-radius:10px;padding:.35rem .7rem;font-weight:700\"><small style=\"display:block;font-weight:400;color:var(--muted)\">Lô thành phẩm<\/small>Q100-261120-02 · 200 chai<\/span><b style=\"color:var(--que)\">→<\/b><span style=\"background:#fff;border:1px solid #c9b7a3;border-radius:10px;padding:.35rem .7rem;font-weight:700\"><small style=\"display:block;font-weight:400;color:var(--muted)\">Dải serial<\/small>tem 1–150 (in 19:41 20/11, Chủ DN)<\/span><\/div><p class=\"muted\" style=\"margin:.4rem 0 0\">Thiếu 50 tem s         if (p) p.classList.toggle("hidden", x !== b);
      });
    }

    st.textContent = "button[data-pick][aria-pressed=true]:not(.choice){background:#8a3b12;color:#fff;border-color:#8a3b12}.dim{opacity:.55}";
    document.head.appendChild(st);
    document.addEventListener("submit", function (e) { e.preventDefault(); }, true);
  <\/script>`;
  function docFor(s) {
    let h = s.html.replace("<!--APPCSS-->", "<style>" + D.css + "</style>");
    return h.replace("</body>", INJECT + "</body>");
  }
  function route(href, group) {
    if (!href || href.startsWith("http") || href.startsWith("tel:")) return null;
    const owner = group === "Chủ doanh nghiệp";
    const p = href.split("?")[0];
    const map = [
      [/^\/$/, owner ? "home_owner" : "home_shop"], [/^\/logout/, "login"], [/^\/login/, "login"],
      [/^\/nhap-hang\/phu-lieu/, "ingr_receipt"], [/^\/nhap-hang\/nguoi-ban-moi/, "receipt_newsup"], [/^\/nhap-hang\/in-phieu/, "receipt_print"],
      [/^\/ton-kho\/kiem-ke/, "inv_kk"], [/^\/in\/tem-bo-sung/, "print_roll"], [/^\/ton-kho\/phu-lieu/, "ingr_stock"], [/^\/mau-luu/, "retain_list"], [/^\/in\/tem-me/, "print_batch"],
      [/^\/san-xuat\/ua\/\d+\/ngui/, "cure_smell"], [/^\/san-xuat\/ua\/\d+\/ket-qua/, "cure_result"], [/^\/san-xuat\/ua\/\d+/, "cure_detail"], [/^\/san-xuat\/ua/, "cure_list"],
      [/^\/quan-ly\/cong-thuc\/\w+/, "recipe_edit"], [/^\/quan-ly\/cong-thuc/, "recipe_list"], [/^\/quan-ly\/phu-lieu/, "ingr_stock"],
      [/^\/quan-ly\/mau-luu/, "retain_list"], [/^\/quan-ly\/thu-luu-huong/, "scent_trial"],
      [/^\/quan-ly\/lo-thanh-pham\/.+/, "lot_detail"],
      [/^\/nhap-hang/, "receipt_1"], [/^\/phieu-nhap/, "receipt_list"], [/^\/xuat-hang\/que-kho/, "issue_dry"],
      [/^\/xuat-hang\/don-hang/, "issue_product"], [/^\/xuat-hang/, "issue_menu"], [/^\/don-hang/, "issue_list"],
      [/^\/ton-kho/, "inv_nl"], [/^\/san-xuat\/\d+/, "prod_order"], [/^\/san-xuat/, owner ? "prod_owner" : "prod_list"],
      [/^\/dong-goi/, "labels"], [/^\/quan-ly\/bang-gia/, "prices"], [/^\/quan-ly\/danh-muc\/nguoi-ban/, /approved=0/.test(href) ? "supplier_approve" : /moi=1/.test(href) ? "supplier_add" : "suppliers"],
      [/^\/quan-ly\/danh-muc\/dia-ban/, "area"], [/^\/quan-ly\/danh-muc\/loai-hang/, "goods_type"],
      [/^\/quan-ly\/danh-muc\/nguyen-lieu/, /moi=1/.test(href) ? "material_edit" : "material"],
      [/^\/quan-ly\/danh-muc\/khach-hang/, /moi=1/.test(href) ? "customer_dm_edit" : "customer_dm"],
      [/^\/quan-ly\/danh-muc\/chung-nhan/, "cert"], [/^\/quan-ly\/danh-muc\/tai-khoan/, "account"],
      [/^\/quan-ly\/danh-muc\/san-pham/, "products"], [/^\/quan-ly\/danh-muc\/cai-dat/, "settings"], [/^\/quan-ly\/danh-muc/, "admin"],
      [/^\/quan-ly\/cuon-tem/, "rolls"], [/^\/quan-ly\/lo-thanh-pham/, "plots_lots"], [/^\/quan-ly\/tra-cuu/, "trace"],
      [/^\/quan-ly\/khach-hang/, /[?&]id=/.test(href) ? "buyer_detail" : "buyers"], [/^\/quan-ly\/bao-cao/, "reports"], [/^\/quan-ly\/vung-nguyen-lieu/, "vung_nguyen_lieu"],
      [/^\/quan-ly/, "admin"], [/^\/q\//, "q_ok"], [/^\/truy-xuat/, "q_form"], [/^\/$/, "q_ok"]];
    for (const [re, k] of map) if (re.test(p)) return k;
    return null;
  }
  function goTo(i) { if (i !== cur) show(i); } // đích là chính màn đang mở: giữ nguyên
  function hint(t) { const h = document.getElementById("hint"); h.textContent = t; h.classList.add("show"); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove("show"), 2200); }
  function toast(t) { const h = document.getElementById("toast"); h.textContent = t; h.classList.add("show"); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove("show"), 2000); }
  function handleGo(g, btn) {
    if (/^(https?:|tel:|\/api\/)/.test(g)) return hint("Liên kết ngoài / tải file: bản xem trước không mở");
    if (g === "#") return hint("Liên kết chưa có đích trong bản xem trước");
    if (g[0] === "#") { // data-go="#khoá-màn": chỉ nhận khoá có trong bảng màn
      const key = g.slice(1).replace(/_/g, "-");
      if (!Object.hasOwn(byKey, key)) hint("Màn hình này không có trong bản xem trước");
      else if (byKey[key] === cur && btn) hint("Bản xem trước: nút “" + btn + "” không chạy thật"); // nút trỏ về chính màn này = không có việc gì để làm
      else goTo(byKey[key]);
      return;
    }
    const k = route(g, S[cur].group), key = k && k.replace(/_/g, "-");
    if (key && Object.hasOwn(byKey, key)) goTo(byKey[key]); else hint("Màn hình này không có trong bản xem trước");
  }
  window.addEventListener("message", (e) => {
    if (!e.data) return;
    if (e.data.hint) return hint(e.data.hint);
    if (e.data.saved === true) { // data-act="save": thông báo xanh cố định «Đã lưu» 2 giây; có data-go thì đi tiếp (thông báo nằm ở vỏ nên còn hiện sau khi đổi màn)
      toast("Đã lưu");
      if (typeof e.data.go === "string" && e.data.go) setTimeout(() => handleGo(e.data.go, ""), 450);
      return;

    if (e.data.go !== undefined) handleGo(e.data.go || "", e.data.btn);
  });
  const nav = document.getElementById("nav");
  let g = null;
  S.forEach((s, i) => {
    if (s.group !== g) { g = s.group; const h = document.createElement("h3"); h.textContent = g; nav.append(h); }
    const b = document.createElement("button");
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span>`; b.append(s.title);
    b.onclick = () => { show(i); document.body.classList.remove("menu"); };
    nav.append(b);
  });
  function show(i) {
    cur = (i + S.length) % S.length;
    const s = S[cur], view = document.getElementById("view");
    view.innerHTML = "";
    const f = document.createElement("iframe");

      const ph = document.createElement("div"); ph.className = "phone";
      const n = document.createElement("div"); n.className = "notch";

    } else { f.className = "app"; view.append(f); }
    f.srcdoc = docFor(s);
    document.getElementById("title").textContent = s.title;
    document.getElementById("grp").textContent = s.group;
    document.getElementById("pos").textContent = `${cur + 1} / ${S.length}`;
    nav.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === cur));
    const on = nav.querySelector("button.on"); if (on) on.scrollIntoView({ block: "nearest" });
    try { history.replaceState(null, "", "#" + s.key); } catch (e) {}
  }
  document.getElementById("prev").onclick = () => show(cur - 1);
  document.getElementById("next").onclick = () => show(cur + 1);
  document.getElementById("menu").onclick = () => document.body.classList.toggle("menu");
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
  const start = location.hash.slice(1);
  show(Object.hasOwn(byKey, start) ? byKey[start] : byKey["home-shop"] ?? 0);
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (Object.hasOwn(byKey, k) && byKey[k] !== cur) show(byKey[k]); });
})();
</script>
